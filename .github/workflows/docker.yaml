name: Build Docker image

# This build requires a version tag. It's built into the client, to be checked against backend required version.
on:
  push:
    tags:
      - 'v*'

# Defines two custom environment variables for the workflow. These are used for the Container registry domain, and a name for the Docker image that this workflow builds.
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# No permissions by default; each job asks for exactly what it needs.
permissions: {}

# Actions are pinned to full commit SHAs, not tags. A tag is mutable: whoever
# controls the action's repository can repoint v7 at a different commit, and
# every workflow that says @v7 runs it on the next push. That is how
# tj-actions/changed-files was used to dump runner secrets in March 2025.
# Dependabot (.github/dependabot.yml) keeps these SHAs current.
#
# Supply chain boundary: no job may both run npm and hold registry credentials.
# `build` runs the dependency tree but has no credentials and no registry access.
# `docker` holds the ghcr push token but never runs npm — it only packages the
# artifact `build` produced. Jobs run on separate VMs, so a compromised dependency
# cannot read the docker credentials file.
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Default is true, which writes GITHUB_TOKEN into .git/config where
          # every npm script run later in this job could read it.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.x'
          cache: 'npm'
      # Only used here for the `version` output, which is baked into the client and
      # compared against the version the backend reports. Needs no credentials.
      - name: Extract version metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      # --ignore-scripts blocks dependency install hooks (pre/post-install), the most
      # common supply chain vector. Verified that lint, tests and build all pass
      # without them; no dependency here needs a build step at install time.
      - run: npm ci --ignore-scripts
      - run: npm run lint -- --no-fix
      - run: npm test
      - name: Build distribution files
        env:
          VITE_FRONTEND_VERSION: ${{ steps.meta.outputs.version }}
        run: npm run build
      - name: Upload distribution files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          retention-days: 1
          if-no-files-found: error

  # This job holds the registry credential, so nothing untrusted may run in it
  # before the push. It builds, scans, and only then logs in and pushes, so the
  # credential exists for the last two steps and the scanner never shares a
  # job state with it.
  docker:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Trivy's findings are uploaded as SARIF to the Security tab. Free for
      # this repo because it is public; a private repo needs GitHub Advanced
      # Security, and without it the upload step fails.
      security-events: write
    steps:
      # Only Dockerfile and etc/nginx.conf are used here, nothing is run.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The distribution files built by the `build` job. Dockerfile copies ./dist.
      - name: Download distribution files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # Build without pushing, so the scans below run before the job holds a
      # registry credential. The image stays in the runner's docker daemon;
      # the push step further down sends the very bytes that were scanned,
      # rather than rebuilding them.
      - name: Build docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Select image to scan
        id: image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: echo "ref=$(head -n 1 <<<"$TAGS")" >> "$GITHUB_OUTPUT"

      # The scans here report, they never stop a release: every fixable
      # finding, at any severity, goes to the Security tab, and the weekly
      # scan_image.yaml is what fails (and mails the maintainers) while a
      # published image is affected.
      - name: Scan image with Trivy (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: sarif
          output: trivy-results.sarif
          # Unfixed CVEs in the Alpine base are not actionable here -- there is
          # no version to upgrade to -- and they drown out what is. Rebuilds
          # pick them up as soon as a fix ships, since the base image digest is
          # bumped by Dependabot.
          ignore-unfixed: true

      - name: Upload Trivy results to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      # The same findings, HIGH/CRITICAL only, as a table in the job log for
      # whoever is watching the release. Trivy is already installed and the
      # vulnerability database is cached from the pass above, so this is a
      # second read of local data, not a second download.
      - name: Scan image with Trivy (summary)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 0
          skip-setup-trivy: true
        env:
          TRIVY_SKIP_DB_UPDATE: true
          TRIVY_SKIP_JAVA_DB_UPDATE: true

      # Trivy never sees nginx itself: the base installs it from nginx.org's
      # apk repository, which Alpine's security database does not cover. So
      # ask the image which nginx it has and check that against nginx.org's
      # advisories directly. Report-only like the Trivy passes: matches show as
      # annotations on the run and a table in the job summary, and
      # continue-on-error keeps them from stopping the push.
      - name: Check nginx against nginx.org advisories
        continue-on-error: true
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: .github/scripts/check_nginx_image.sh "$IMAGE"

      # Keep the login as late as possible: it writes the credential to
      # ~/.docker/config.json, where every later step can read it. Everything
      # above -- including the scanner, which is third-party code -- runs
      # before the job has a registry credential to leak.
      - name: Log in to the Container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push docker image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            docker push "$tag"
          done
