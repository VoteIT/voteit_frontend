# Pinning actions and base images to SHAs stops a mutable tag from being
# repointed at malicious code, but it also freezes security updates. These
# entries are what unfreezes them: Dependabot opens a PR when a pinned SHA
# falls behind, and rewrites the trailing "# vX.Y.Z" comment as it goes.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Refreshes the nginx digest in the Dockerfile. The tag stays 1-alpine-slim;
  # what moves is which build of it we get, which is where Alpine's security
  # fixes arrive.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
